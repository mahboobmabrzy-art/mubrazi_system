<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المبرزي للبصريات والسمعيات</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 20px; padding: 0; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e3a8a; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 15px; width: 100%; padding: 10px; background-color: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
        #status { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>نظام المبرزي للبصريات والسمعيات</h2>
        <form id="invoiceForm">
            <label>اسم العملاء / العميل:</label>
            <input type="text" id="name" required>
            
            <label>رقم الهاتف:</label>
            <input type="text" id="phone" required>
            
            <label>المبلغ الإجمالي:</label>
            <input type="number" step="0.01" id="amount" required>
            
            <label>المبلغ المدفوع:</label>
            <input type="number" step="0.01" id="paid" required>
            
            <label>تفاصيل الفاتورة:</label>
            <textarea id="details" rows="2"></textarea>
            
            <label>بيانات مقاس النظارة / السمعيات:</label>
            <textarea id="prescription" rows="2"></textarea>
            
            <button type="submit">حفظ الفاتورة</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.style.color = "blue";
            status.innerText = "جاري الحفظ...";

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                amount: parseFloat(document.getElementById('amount').value),
                paid: parseFloat(document.getElementById('paid').value),
                details: document.getElementById('details').value,
                prescription: document.getElementById('prescription').value
            };

            try {
                const res = await fetch('/api/save_full_invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    status.style.color = "green";
                    status.innerText = "تم حفظ الفاتورة بنجاح!";
                    document.getElementById('invoiceForm').reset();
                } else {
                    status.style.color = "red";
                    status.innerText = "حدث خطأ أثناء الحفظ";
                }
            } catch(err) {
                status.style.color = "red";
                status.innerText = "فشل الاتصال بالخادم";
            }
        });
    </script>
</body>
</html>
